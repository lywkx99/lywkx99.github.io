<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinesin Gating — Tension Model</title>
<style>
:root{
  color-scheme:light dark;
  --background:light-dark(#ffffff,#181818);
  --foreground:light-dark(#1a1c1f,#ffffff);
  --muted:light-dark(rgb(26 28 31/10%),rgb(255 255 255/12%));
  --muted-foreground:light-dark(rgb(26 28 31/55%),rgb(255 255 255/55%));
  --border:light-dark(rgb(26 28 31/12%),rgb(255 255 255/14%));
  --headA:light-dark(#339cff,#83c3ff);
  --headB:light-dark(#f3883b,#f59a56);
  --fuel:light-dark(#00a240,#40c977);
  --adp:light-dark(#eb77b1,#f08fc0);
  --green:light-dark(#00a240,#40c977);
  --red:light-dark(#e02e2a,#ff6764);
  --amber:light-dark(#e25507,#fb6a22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);
  font-family:Arial,Helvetica,sans-serif;font-weight:700;padding:18px}
#motor{width:100%;max-width:1040px;margin:0 auto}
#motor,#motor *{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.mg-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.mg-heading strong{font-size:17px}
.mg-sub{font-size:12px;color:var(--muted-foreground)}
.mg-controls{margin-top:16px;display:flex;gap:10px}
.btn{font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--border)}
.btn-primary{background:var(--foreground);color:var(--background);border-color:transparent}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted-foreground)}
.mg-states{margin-top:14px;font-size:13px}
.mg-states .muted{color:var(--muted-foreground)}
.mg-scene{display:block;width:100%;height:680px;overflow:hidden;margin-top:6px}
.mg-scene text{fill:var(--foreground);font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px}
.mg-detail{min-height:3.2em;margin-top:10px;font-size:13px;color:var(--muted-foreground)}
</style>
</head>
<body>
<div id="motor">
  <div class="mg-row mg-heading">
    <strong>How ATP Drives Two Heads to Step Alternately</strong>
    <span class="mg-sub">2D Mechanical Analogy &middot; Simplified Gating Model</span>
  </div>
  <div class="mg-controls">
    <button class="btn btn-primary" type="button" data-action="atp">Inject ATP &middot; Auto Step</button>
    <button class="btn btn-ghost" type="button" data-action="reset">Reset</button>
  </div>
  <div class="mg-row mg-states"><span data-state>01 / Awaiting ATP</span><span class="muted" data-cycle>0 Cycles Completed</span></div>
  <svg class="mg-scene" role="img" aria-label="Two-headed motor with two synchronized magnifiers"></svg>
  <div class="mg-detail" data-detail aria-live="polite"></div>
</div>
<script>
(() => {
  const root=document.getElementById('motor');
  const svg=root.querySelector('.mg-scene');
  const atpBtn=root.querySelector('[data-action="atp"]');
  const resetBtn=root.querySelector('[data-action="reset"]');
  const stateEl=root.querySelector('[data-state]');
  const cycleEl=root.querySelector('[data-cycle]');
  const detailEl=root.querySelector('[data-detail]');

  // Head identity colours are FIXED for the whole run: A is always blue, B always orange.
  // Mechanism is carried only by arrows and label colours, never by the head colour.
  const C=['var(--headA)','var(--headB)'];
  const BG='var(--background)', MUTED='var(--muted-foreground)';
  const FUEL='var(--fuel)', ADP='var(--adp)';
  const CONTRACT='var(--red)', RESTORE='var(--green)', WIDEN='var(--amber)';

  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const name=i=>i===0?'A':'B';
  const mix=(a,b,t)=>a+(b-a)*t;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const initial=()=>({a:0,b:0,ay:292,by:190,camera:0,gate:0,rearOpen:0,rearShift:0,tension:0,
    footA:1,footB:0,keyDx:0,keyDy:0,keyAlpha:0,keyAngle:0,flash:0,products:0,hydro:0,shift:0,recover:0});
  let m=initial(), phase=0, cycles=0, active=0, focus=0, width=1000, busy=false, epoch=0;
  let event='ready', flying=false, held=-1, running=false, testable=false;

  const phases=['Awaiting ATP','ATP Bound','Front Foot Lands / Tension Gating',
                'Simultaneous: Rear Releases ADP + Pi / Front Rejects ATP',
                'Rear Foot Steps Forward / Tension Released'];
  const instructions=[
    ()=>'Inject ATP to trigger binding, the lever swing, the forward reach, tension gating and reset.',
    ()=>'ATP is lodged in head '+name(active)+'; binding rotates the neck linker and throws the partner head forward.',
    ()=>'Tension is now on. Try injecting ATP into front head '+name(focus)+': the main view and the magnifier show the collision and the rebound together.',
    ()=>'One tension, two consequences at once: the rear pocket has opened so its nucleotide leaves, while the front pocket has closed so nothing can enter.',
    ()=>'The rear head swings forward; once level, tension is released and the front pocket relaxes back into a bindable shape.'
  ];
  function update(msg){
    stateEl.textContent='0'+(phase+1)+' / '+phases[phase];
    cycleEl.textContent=cycles+' Cycle'+(cycles===1?'':'s')+' Completed';
    atpBtn.textContent=running?('Inject More ATP · Test Head '+name(focus)):'Inject ATP · Auto Step';
    atpBtn.disabled=busy||(running&&!testable);
    detailEl.textContent=msg||instructions[phase]();
  }

  const esc=t=>String(t);
  function text(x,y,t,opt){
    opt=opt||{};
    return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(opt.anchor||'middle')+'"'
      +(opt.fill?' fill="'+opt.fill+'"':'')
      +(opt.size?' style="font-size:'+opt.size+'px"':'')+'>'+esc(t)+'</text>';
  }
  const line=(x1,y1,x2,y2,color,weight,extra)=>'<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(color||MUTED)+'" stroke-width="'+(weight||1)+'" '+(extra||'')+'/>';

  const open=[[68,-24],[36,-24],[36,-10],[21,-10],[21,10],[36,10],[36,24],[68,24]];
  const shut=[[68,-11],[51,-11],[42,-2],[28,5],[35,17],[49,9],[57,12],[68,5]];
  const wide=[[68,-37],[36,-37],[36,-19],[9,-19],[9,19],[36,19],[36,37],[68,37]];
  function slot(g,r){r=r||0;return open.map((p,i)=>mix(mix(p[0],wide[i][0],r),shut[i][0],g).toFixed(2)+','+mix(mix(p[1],wide[i][1],r),shut[i][1],g).toFixed(2)).join(' ');}

  function nucleotide(dx,dy,angle,alpha,kind,scale){
    const col=kind==='ATP'?FUEL:ADP;
    return '<g transform="translate('+dx+' '+dy+') rotate('+angle+' 45 0)" opacity="'+alpha+'">'
      +'<path d="M65 -22 H38 V-8 H23 V8 H38 V22 H65 Z" fill="'+BG+'"/>'
      +'<path d="M65 -22 H38 V-8 H23 V8 H38 V22 H65 Z" fill="'+col+'" fill-opacity=".52" stroke="'+col+'" stroke-width="2.5"/>'
      +'<text x="51" y="4" text-anchor="middle" style="font-size:'+(12/scale).toFixed(1)+'px">'+kind+'</text></g>';
  }

  function motor(i,g,scale,zoom){
    const spread=(i===active&&phase>=2)?m.rearOpen:0;
    const D='M-65 -3 C-65 -31 -48 -45 -19 -45 H32 Q67 -45 67 -19 V20 Q67 45 31 45 H-25 Q-65 42 -65 -3 Z';
    let s='<path d="'+D+'" fill="'+BG+'" stroke="'+C[i]+'" stroke-width="2.7"/>';
    s+='<path d="'+D+'" fill="'+C[i]+'" fill-opacity=".14"/>';
    s+='<path d="M-46 -14 Q-25 -32 -7 -24 M-46 15 Q-23 28 -3 24" fill="none" stroke="'+C[i]+'" stroke-opacity=".4" stroke-width="2"/>';
    // Pocket outline keeps the head's own colour; only its line weight reacts.
    const emph=(g>.5)||(i===focus&&m.recover>.35)||spread>.5;
    s+='<polygon points="'+slot(g,spread)+'" fill="'+BG+'" stroke="'+C[i]+'" stroke-width="'+(emph?4:3)+'"/>';
    if(spread>.01)s+='<g opacity="'+spread+'"><path d="M34 '+(-28-spread*11)+' H65 M34 '+(28+spread*11)+' H65" fill="none" stroke="'+C[i]+'" stroke-width="4" stroke-linecap="round"/></g>';
    if(!zoom)s+='<text x="-20" y="6" text-anchor="middle" style="font-size:'+(14/scale).toFixed(1)+'px">'+name(i)+'</text>';
    // ATP does not vanish: it cross-fades into ADP on the spot while Pi is pushed out of
    // the pocket mouth. The drifting copy in draw() then starts from these exact points.
    if(held===i&&m.products<.0012){   // exclusive with the drifting copy in draw()
      const dx=(i===active?m.rearShift:0);
      if(m.hydro<.999)s+=nucleotide(dx,0,0,(1-m.hydro).toFixed(3),'ATP',scale);
      if(m.hydro>.001){
        s+=nucleotide(dx-4,0,0,m.hydro.toFixed(3),'ADP',scale);
        // Pi is visibly pushed up out of the pocket mouth, clearing the ADP that stays behind.
        s+='<g opacity="'+m.hydro.toFixed(3)+'"><circle cx="'+(70+m.hydro*9).toFixed(1)+'" cy="'+(-5-m.hydro*18).toFixed(1)+'" r="10" fill="'+BG+'" stroke="'+FUEL+'" stroke-width="2"/>'
          +'<text x="'+(70+m.hydro*9).toFixed(1)+'" y="'+(-1-m.hydro*18).toFixed(1)+'" text-anchor="middle" style="font-size:'+(11/scale).toFixed(1)+'px">Pi</text></g>';
      }
    }
    if(i===focus&&flying)s+=nucleotide(m.keyDx,m.keyDy,m.keyAngle,m.keyAlpha,'ATP',scale);
    return s;
  }

  function layout(){
    const small=width<640, scale=small?.70:.9, gap=small?width*.33:Math.min(205,width*.29);
    const base=width*.32;
    const xp=u=>base+(u-m.camera)*gap;
    const p=[{x:xp(m.a),y:m.ay},{x:xp(m.b),y:m.by}];
    const socket={x:p[focus].x+45*scale,y:p[focus].y};
    return {small,scale,gap,p,socket};
  }

  function draw(){
    const L=layout(), scale=L.scale, p=L.p, socket=L.socket, small=L.small, w=width, q=p[focus];
    // Wider lens separation + width-aware type sizes keep captions from colliding.
    const lensR=small?70:100, capSize=small?10:12, statSize=small?9.5:11.5;
    // Pinned by head IDENTITY, not by role: the left lens is always head A (blue) and the
    // right always head B (orange), so the palette never flips when a cycle hands over.
    const lenses=[0,1].map((i,k)=>({i,x:w*(k===0?.235:.765),y:520,r:lensR,z:small?1.1:1.5}));
    svg.setAttribute('viewBox','0 0 '+w+' 680');

    const pulse=m.flash;
    const halo=event==='accepted'?RESTORE:(event==='rejected'||event==='collision')?CONTRACT:C[focus];
    let s='<title>Tension opens the rear pocket and contracts the front pocket at the same time</title>';
    s+='<defs>'+lenses.map(l=>'<clipPath id="lens-'+l.i+'"><circle cx="'+l.x+'" cy="'+l.y+'" r="'+(l.r-2)+'"/></clipPath>').join('');
    s+='<marker id="mk-widen" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4.4" markerHeight="4.4" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="'+WIDEN+'"/></marker>';
    s+='<marker id="mk-contract" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4.4" markerHeight="4.4" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="'+CONTRACT+'"/></marker>';
    s+='<marker id="mk-restore" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4.4" markerHeight="4.4" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="'+RESTORE+'"/></marker>';
    s+='</defs>';

    s+=text(12,24,small?'MAIN VIEW':'MAIN VIEW · ATP ACTS DIRECTLY ON THE HEADS',{anchor:'start',size:capSize});
    s+=text(w-12,24,'FORWARD →',{anchor:'end',size:capSize});

    for(const l of lenses){
      const sx=p[l.i].x+45*scale, sy=p[l.i].y;
      s+='<path d="M'+(sx-16)+' '+(sy+23)+' L'+(l.x-l.r*.65)+' '+(l.y-l.r*.76)+' L'+(l.x+l.r*.65)+' '+(l.y-l.r*.76)+' L'+(sx+16)+' '+(sy+23)+' Z" fill="'+C[l.i]+'" fill-opacity=".035"/>';
      s+='<path d="M'+(sx-16)+' '+(sy+23)+' L'+(l.x-l.r*.65)+' '+(l.y-l.r*.76)+' M'+(sx+16)+' '+(sy+23)+' L'+(l.x+l.r*.65)+' '+(l.y-l.r*.76)+'" fill="none" stroke="'+C[l.i]+'" stroke-opacity=".45" stroke-width="1.3"/>';
    }

    const center=(p[0].x+p[1].x)/2-14, top=94;
    s+='<path d="M'+(center-8)+' 55 V78 Q'+(center-8)+' 86 '+center+' 92 Q'+(center+8)+' 86 '+(center+8)+' 78 V55" fill="var(--muted)" stroke="'+MUTED+'" stroke-width="1.5"/>';
    for(let i=0;i<2;i++){
      const h=p[i], ex=mix(center,h.x-27*scale,.64)+(i===0?-17:17), ey=mix(top,h.y-34*scale,.52);
      const path='M'+center+' '+top+' L'+ex+' '+ey+' L'+(h.x-30*scale)+' '+(h.y-31*scale);
      s+='<path d="'+path+'" fill="none" stroke="'+C[i]+'" stroke-opacity=".14" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>';
      s+='<path d="'+path+'" fill="none" stroke="'+C[i]+'" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>';
      s+='<path d="'+path+'" fill="none" stroke="'+BG+'" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/>';
      s+='<circle cx="'+ex+'" cy="'+ey+'" r="8" fill="'+BG+'" stroke="'+C[i]+'" stroke-width="3"/><circle cx="'+ex+'" cy="'+ey+'" r="2.5" fill="'+C[i]+'"/>';
    }
    s+='<circle cx="'+center+'" cy="'+top+'" r="12" fill="'+BG+'" stroke="'+MUTED+'" stroke-width="2"/><circle cx="'+center+'" cy="'+top+'" r="4" fill="'+MUTED+'"/>';

    if(m.tension>.03){
      const left=Math.min(p[0].x,p[1].x)-7, right=Math.max(p[0].x,p[1].x)-7, sy=186;
      let d='M'+left+' '+sy;
      for(let k=1;k<=16;k++)d+=' L'+mix(left,right,k/16).toFixed(1)+' '+(sy+(k===16?0:(k%2?5:-5)));
      // Own reserved row at the very top (y=62). Head captions never rise above y≈120
      // even at the top of the lift, so this row can never be reached by them.
      s+='<g opacity="'+m.tension.toFixed(2)+'"><path d="'+d+'" fill="none" stroke="'+CONTRACT+'" stroke-width="2.4"/>'
        +text(12,62,'TENSION → BIDIRECTIONAL GATING',{anchor:'start',fill:CONTRACT,size:capSize})+'</g>';
    }

    const railY=350, rbase=width*.32, gap=L.gap;
    for(let k=Math.floor(m.camera)-4;k<=Math.floor(m.camera)+7;k++){
      const tx=rbase+(k-m.camera)*gap;
      if(tx<-gap||tx>w+gap)continue;
      s+='<rect x="'+(tx-gap*.45).toFixed(1)+'" y="'+(railY-7)+'" width="'+(gap*.9).toFixed(1)+'" height="15" rx="7.5" fill="var(--muted)"/>';
      s+='<path d="M'+(tx-18).toFixed(1)+' '+(railY-9)+' v-8 h36 v8" fill="'+BG+'" stroke="'+MUTED+'" stroke-width="1.5"/>';
      if(tx>30&&tx<w-30)s+=text(tx,376,String(k+1),{size:capSize});
    }

    // Every main-view caption is anchored to its OWN head and stacked on fixed offsets,
    // so two captions can only meet if their heads meet — which the step never does.
    const ROLE_DY=-52, MECH_DY=-76, OUT_DY=-100;
    for(let i=0;i<2;i++){
      const h=p[i], down=i===0?m.footA:m.footB;
      if(down>.01){
        s+='<g opacity="'+down.toFixed(2)+'"><ellipse cx="'+h.x.toFixed(1)+'" cy="341" rx="25" ry="5" fill="'+C[i]+'" fill-opacity=".14"/>'
          +line(h.x-17,332,h.x+17,332,C[i],4)+line(h.x-12,h.y+39*scale,h.x-12,331,C[i],2)+line(h.x+12,h.y+39*scale,h.x+12,331,C[i],2)+'</g>';
      }
      s+='<g transform="translate('+h.x.toFixed(1)+' '+h.y.toFixed(1)+') scale('+scale+')">'+motor(i,i===focus?m.gate:0,scale,false)+'</g>';
      const role=i===active?(phase<2?'BOUND':'REAR'):(phase<2?'FREE':'FRONT');
      s+=text(h.x-24*scale,h.y+ROLE_DY*scale,name(i)+' · '+role,{size:capSize});
    }
    if(m.tension>.3&&m.recover<.2&&phase>=2){
      const rear=p[active], front=p[focus];
      s+=text(clamp(rear.x,86,w-86),rear.y+MECH_DY*scale,'WIDENED → RELEASES',{fill:WIDEN,size:capSize});
      if(event!=='collision'&&event!=='rejected')
        s+=text(clamp(front.x,86,w-86),front.y+MECH_DY*scale,'CONTRACTED → BLOCKED',{fill:CONTRACT,size:capSize});
    }
    if(m.recover>.35)
      s+=text(clamp(p[focus].x,86,w-86),p[focus].y+MECH_DY*scale,'POCKET RESTORED',{fill:RESTORE,size:capSize});

    s+='<circle cx="'+socket.x.toFixed(1)+'" cy="'+socket.y.toFixed(1)+'" r="'+(29*scale).toFixed(1)+'" fill="none" stroke="'+halo+'" stroke-width="'+(pulse?3:1.5)+'" stroke-opacity="'+(pulse?.7:.5)+'" stroke-dasharray="'+(event==='ready'?'4 4':'none')+'"/>';
    if(pulse>.02)s+='<circle cx="'+socket.x.toFixed(1)+'" cy="'+socket.y.toFixed(1)+'" r="'+(31*scale+12*(1-pulse)).toFixed(1)+'" fill="none" stroke="'+halo+'" stroke-width="2" opacity="'+(pulse*.55).toFixed(2)+'"/>';
    if(flying&&(Math.abs(m.keyDx)>3||Math.abs(m.keyDy)>3)){
      s+='<path d="M'+socket.x.toFixed(1)+' '+socket.y.toFixed(1)+' Q'+(socket.x+32).toFixed(1)+' '+(socket.y-48).toFixed(1)+' '+(socket.x+m.keyDx*scale).toFixed(1)+' '+(socket.y+m.keyDy*scale).toFixed(1)+'" fill="none" stroke="'+(event==='rejected'?CONTRACT:FUEL)+'" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/>';
    }
    if(event==='accepted'||event==='collision'||event==='rejected'){
      const t=event==='accepted'?'MATCH · DOCKED':event==='collision'?'MISMATCH · COLLISION':'MISMATCH · REBOUNDED';
      s+=text(clamp(q.x,92,w-92),q.y+OUT_DY*scale,t,{fill:event==='accepted'?RESTORE:CONTRACT,size:capSize});
    }

    // The products continue from EXACTLY where motor() left them and arc away to the upper
    // left, so there is no jump between "hydrolysed in place" and "drifting away".
    if(m.products>.001){
      const h=p[active], t=m.products, fade=clamp(1-Math.max(0,(t-.55)/.45),0,1);
      const bez=(a,c,b,u)=>(1-u)*(1-u)*a+2*(1-u)*u*c+u*u*b;
      // start = in-pocket positions used by motor(); ctrl pulls the path up and over the head
      const a0x=h.x+(m.rearShift-4+51)*scale, a0y=h.y;
      const p0x=h.x+79*scale,                 p0y=h.y-23*scale;   // matches motor()'s raised Pi
      // Control points pull the path sideways FIRST, so the products are already clear of
      // the head's caption column (h.x ± ~80) before they climb into that band.
      const a1x=h.x-170*scale, a1y=h.y-140, p1x=h.x-210*scale, p1y=h.y-168;
      const acx=h.x-150*scale, acy=h.y+6,   pcx=h.x-160*scale,  pcy=h.y-6;
      const ax=bez(a0x,acx,a1x,t), ay=bez(a0y,acy,a1y,t);
      const px=bez(p0x,pcx,p1x,t), py=bez(p0y,pcy,p1y,t);
      if(fade>.01){
        s+='<path d="M'+a0x.toFixed(1)+' '+a0y.toFixed(1)+' Q'+acx.toFixed(1)+' '+acy.toFixed(1)+' '+ax.toFixed(1)+' '+ay.toFixed(1)+'" fill="none" stroke="'+ADP+'" stroke-width="2" stroke-dasharray="4 4" opacity="'+(fade*.5).toFixed(2)+'"/>';
        s+='<g transform="translate('+(ax-51*scale).toFixed(1)+' '+ay.toFixed(1)+') scale('+scale+')" opacity="'+fade.toFixed(2)+'">'+nucleotide(0,0,0,1,'ADP',scale)+'</g>';
        s+='<g transform="translate('+px.toFixed(1)+' '+py.toFixed(1)+') scale('+scale+')" opacity="'+fade.toFixed(2)+'">'
          +'<circle r="10" fill="'+BG+'" stroke="'+FUEL+'" stroke-width="2"/><text y="4" text-anchor="middle" style="font-size:'+(11/scale).toFixed(1)+'px">Pi</text></g>';
      }
    }

    // Magnifiers. Ring stays the head's own colour; mechanism is arrows + caption colour only.
    for(const l of lenses){
      const isFront=(l.i===focus), isRear=(l.i===active);
      s+='<circle cx="'+l.x.toFixed(1)+'" cy="'+l.y+'" r="'+l.r+'" fill="'+BG+'" stroke="'+C[l.i]+'" stroke-width="2.4"/>';
      s+='<g clip-path="url(#lens-'+l.i+')"><g transform="translate('+(l.x-45*l.z).toFixed(1)+' '+l.y+') scale('+l.z+')">'+motor(l.i,l.i===focus?m.gate:0,l.z,true);
      if(phase>=2&&m.tension>.3&&isRear&&m.recover<.2){
        s+='<g opacity="'+m.tension.toFixed(2)+'" stroke-linecap="round">'
          +line(51,-32,51,-55,WIDEN,3.2,'marker-end="url(#mk-widen)"')
          +line(51,32,51,55,WIDEN,3.2,'marker-end="url(#mk-widen)"')+'</g>';
      }
      if(phase>=2&&m.tension>.3&&isFront&&m.recover<.2){
        const k=m.tension, o=5.5*Math.sin(Date.now()/210);
        s+='<g opacity="'+k.toFixed(2)+'" stroke-linecap="round">'
          +line(46,-56-o,46,-27,CONTRACT,3.6,'marker-end="url(#mk-contract)"')
          +line(46,56+o,46,27,CONTRACT,3.6,'marker-end="url(#mk-contract)"')
          +line(96+o,2,72,2,CONTRACT,3.6,'marker-end="url(#mk-contract)"')
          +line(2-o,-12,20,-7,CONTRACT,3.2,'marker-end="url(#mk-contract)"')+'</g>';
      }
      if(isFront&&m.recover>.02){
        const k=m.recover, o=8*(1-k);
        s+='<g opacity="'+k.toFixed(2)+'" stroke-linecap="round">'
          +line(46,-24+o,46,-54,RESTORE,3.6,'marker-end="url(#mk-restore)"')
          +line(46,24-o,46,54,RESTORE,3.6,'marker-end="url(#mk-restore)"')
          +line(72,2,98,2,RESTORE,3.6,'marker-end="url(#mk-restore)"')
          +'<circle cx="45" cy="0" r="'+(36+7*(1-k)).toFixed(1)+'" fill="none" stroke="'+RESTORE+'" stroke-width="2" stroke-dasharray="5 5" opacity="'+(k*.7).toFixed(2)+'"/></g>';
      }
      s+='</g></g>';
      s+=text(l.x,l.y-l.r-14,small?('HEAD '+name(l.i)):('HEAD '+name(l.i)+' · SAME POCKET, MAGNIFIED'),{size:capSize});

      // Two short lines instead of one long one: never wide enough to collide.
      let a=held===l.i?'ATP DOCKED':(isFront?'OPEN':'FREE HEAD'), b=held===l.i?'':(isFront?'AWAITING ATP':''), col='';
      if(phase>=2&&m.tension>.3&&m.recover<.2){
        if(isRear){a='POCKET WIDENED';b='RELEASES EASILY';col=WIDEN;}
        else{a='POCKET CONTRACTED';b='BINDING BLOCKED';col=CONTRACT;}
      }
      if(isFront&&(event==='rejected'||event==='collision')){a='MISMATCH';b='ATP REBOUNDED';col=CONTRACT;}
      if(isRear&&m.products>.3&&m.recover<.2){a='ADP + Pi RELEASED';b='POCKET EMPTY';col=ADP;}
      if(isFront&&m.recover>.35){a='POCKET RESTORED';b='READY TO BIND';col=RESTORE;}
      s+=text(l.x,l.y+l.r+21,a,{size:statSize,fill:col||undefined});
      if(b)s+=text(l.x,l.y+l.r+21+statSize+4,b,{size:statSize,fill:col||undefined});
    }
    svg.innerHTML=s;
  }

  // rAF is throttled to zero in hidden or background panes; race it against a timer
  // so a cycle can never hang mid-tween.
  function nextFrame(cb){
    let fired=false;
    const go=()=>{if(fired)return;fired=true;cb(performance.now());};
    requestAnimationFrame(go); setTimeout(go,32);
  }
  function tween(values,duration){
    duration=duration||850;
    const token=epoch, start=Object.assign({},m);
    return new Promise(resolve=>{
      const begin=performance.now();
      (function tick(now){
        if(token!==epoch){resolve(false);return;}
        const t=reduced?1:Math.min(1,(now-begin)/duration), e=t*t*(3-2*t);
        Object.keys(values).forEach(k=>m[k]=mix(start[k],values[k],e));
        draw();
        if(t<1)nextFrame(tick); else resolve(true);
      })(performance.now());
    });
  }
  function hold(ms){const token=epoch;return new Promise(r=>setTimeout(()=>r(token===epoch),ms));}
  function startFlight(){
    flying=true;const l=layout();m.keyDx=clamp((width-40-l.socket.x)/l.scale,45,145);
    m.keyDy=-88;m.keyAlpha=1;m.keyAngle=-12;m.flash=0;
  }

  // `standalone` = user pressed the button. When false this runs inside runCycle,
  // concurrently with hydrolysis, and must not touch busy/detail.
  async function rejectAtp(standalone){
    if(standalone){if(busy||!testable)return;busy=true;
      update('A newly added ATP is approaching the front head.');}
    event='approaching';startFlight();
    if(!await tween({keyDx:30,keyDy:0,keyAngle:0},1500))return;
    event='collision';m.flash=1;
    if(standalone)update('Tension has contracted the front pocket out of register: the ATP ridge strikes the rim.');
    if(!await tween({keyDx:21,keyDy:0},620))return;
    if(!await hold(320))return;
    if(!await tween({keyDx:29,keyDy:-3},380))return;
    event='rejected';
    if(!await tween({keyDx:44,keyDy:-57,keyAngle:23,flash:.35},1250))return;
    if(standalone){busy=false;update('The ATP is thrown back; meanwhile the rear pocket has widened and its nucleotide is loosening.');draw();}
  }

  async function runCycle(){
    if(running||busy)return;
    running=true;busy=true;testable=false;
    const other=1-active, token=epoch;
    event='approaching';startFlight();update('ATP is flying toward head '+name(active)+'; docking triggers the step automatically.');
    if(!await tween({keyDx:32,keyDy:0,keyAngle:0},800))return;
    if(!await tween({keyDx:0,keyDy:0},500))return;
    held=active;flying=false;phase=1;event='accepted';m.flash=1;update();
    if(!await tween({flash:.4},350))return;
    const reach={};reach[other===0?'a':'b']=cycles+.52;reach[other===0?'ay':'by']=205;
    if(!await tween(reach,650))return;
    const land={};land[other===0?'a':'b']=cycles+1;land[other===0?'ay':'by']=292;land[other===0?'footA':'footB']=1;
    if(!await tween(land,650))return;

    focus=other;phase=2;event='gated';m.flash=0;
    update('Tension acts on both heads at once: the rear pocket springs open while the front pocket is squeezed out of register.');
    if(!await tween({tension:1,gate:1,rearOpen:1,rearShift:16},2200))return;
    busy=false;testable=true;update();draw();
    if(!await hold(1500))return;
    while(busy){if(!await hold(100))return;}      // let a manual probe finish first
    if(token!==epoch)return;

    // ---- The two consequences of one tension, started together ----------------
    testable=false;busy=true;phase=3;
    update('One tension, two consequences at once: the widened rear pocket hydrolyses its ATP and lets ADP + Pi drift away, while the contracted front pocket turns the incoming ATP back.');
    const rejection=rejectAtp(false);
    const release=(async()=>{
      if(!await tween({hydro:1},1600))return;   // ATP cross-fades into ADP + Pi in place
      if(!await hold(420))return;
      if(!await tween({products:1},3200))return; // then they arc away and fade out
    })();
    await Promise.all([rejection,release]);
    if(token!==epoch)return;
    held=-1;flying=false;m.keyAlpha=0;event='gated';

    // ---- Only after both finish does the rear head step forward ---------------
    phase=4;update('Both consequences are complete, so the rear head is now free to swing forward.');
    const lift={tension:.65};lift[active===0?'ay':'by']=190;lift[active===0?'footA':'footB']=0;
    if(!await tween(lift,800))return;
    const align={camera:cycles+1,shift:1,tension:.2};align[active===0?'a':'b']=cycles+1;
    if(!await tween(align,950))return;
    event='opening';
    update('Both heads are level: tension is released and the front pocket relaxes back into a bindable shape.');
    if(!await tween({gate:0,tension:0,rearOpen:0,rearShift:0,recover:1},900))return;
    if(!await hold(1200))return;
    if(!await tween({recover:0},650))return;
    active=other;focus=other;cycles++;phase=0;m.hydro=0;m.products=0;m.shift=0;
    event='ready';running=false;busy=false;update();draw();
  }

  atpBtn.addEventListener('click',()=>{if(running)rejectAtp(true);else runCycle();});
  resetBtn.addEventListener('click',()=>{epoch++;m=initial();phase=0;cycles=0;active=0;focus=0;held=-1;
    busy=false;running=false;testable=false;flying=false;event='ready';update();draw();});
  new ResizeObserver(e=>{width=Math.max(300,e[0].contentRect.width);draw();}).observe(root);
  width=Math.max(300,root.getBoundingClientRect().width);
  update();draw();
  setInterval(()=>{if(m.tension>.3&&m.gate>.5&&m.recover<.2)draw();},90);
})();
</script>
</body>
</html>
